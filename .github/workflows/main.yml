name: Test Composite Action

on:
  push:
    branches:
      - main

jobs:
  hello_world_job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: foo
        uses: ./
        with:
          who-to-greet: Keshav

      - name: Show random number
        run: echo "Random Number $RANDOM_NUMBER"
        shell: bash
        env:
          RANDOM_NUMBER: ${{ steps.foo.outputs.random-number }}
